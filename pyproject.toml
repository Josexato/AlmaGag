[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AlmaGag"
version = "3.14.1"
description = "Generador Automático de Grafos - Genera diagramas SVG con layout jerárquico inteligente desde archivos JSON (SDJF v2.1)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jose", email = "jose@example.com"}
]
keywords = ["svg", "diagram", "graph", "generator", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "svgwrite>=1.4",
]

[project.optional-dependencies]
debug = []

[project.scripts]
almagag = "AlmaGag.main:main"

[project.urls]
Homepage = "https://github.com/Josexato/AlmaGag"
Repository = "https://github.com/Josexato/AlmaGag.git"
Issues = "https://github.com/Josexato/AlmaGag/issues"

[tool.setuptools]
# Lista explícita (no `packages.find`): el shim `__init__.py` de la raíz del
# repo rompe el auto-descubrimiento de flat-layout (setuptools ve la raíz como
# paquete y devuelve []). H1: la lista anterior declaraba AlmaGag.layout.laf
# —ya inexistente tras el refactor a strategies/— y omitía strategies/*,
# templates, validation y draw.icons/primitives, rompiendo `pip install -e .`.
# Al añadir/mover subpaquetes, actualizar esta lista.
packages = [
    "AlmaGag",
    "AlmaGag.draw",
    "AlmaGag.draw.icons",
    "AlmaGag.draw.primitives",
    "AlmaGag.iteration_debug",
    "AlmaGag.layout",
    "AlmaGag.layout.strategies",
    "AlmaGag.layout.strategies.auto",
    "AlmaGag.layout.strategies.hier",
    "AlmaGag.layout.strategies.legacy",
    "AlmaGag.layout.strategies.legacy.epifania",
    "AlmaGag.layout.templates",
    "AlmaGag.routing",
    "AlmaGag.validation",
]
package-dir = {"AlmaGag" = "AlmaGag"}
